# =====================================================================
# Inventario de Activos de TI - Colegio Ayacucho
# Configuración base (desarrollo).
#
# Ninguna credencial queda "quemada" en el código: todo se puede
# sobrescribir con variables de entorno. Los valores por defecto son
# SOLO para el entorno local de desarrollo.
#
#   DB_URL       -> jdbc:postgresql://localhost:5432/cole
#   DB_USER      -> postgres
#   DB_PASSWORD  -> root
#   SERVER_PORT  -> 8080
# =====================================================================

spring.application.name=inventario-ti
server.port=${SERVER_PORT:8080}

# ------------------------- Base de datos -----------------------------
# URL y credenciales desde variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cole}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (HikariCP). Suficiente para ~780 usuarios del colegio.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ------------------------- JPA / Hibernate ---------------------------
# ddl-auto=update en desarrollo: crea/ajusta tablas automáticamente.
# En producción se recomienda cambiar a "validate" y administrar el
# esquema con database/schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
# Convención: tablas y columnas en snake_case (coincide con schema.sql)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# No ejecutar scripts automáticamente: el script database/schema.sql
# se ejecuta manualmente desde pgAdmin.
spring.sql.init.mode=never

# ------------------------- Thymeleaf ---------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ------------------------- Mensajes / idioma -------------------------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# Formato de fechas y números en español (Perú)
spring.web.locale=es_PE
spring.web.locale-resolver=fixed

# ------------------------- Codificación HTTP -------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ------------------------- Sesiones y cookies ------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=INVENTARIO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En producción con HTTPS: COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ------------------------- Páginas de error --------------------------
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# ------------------------- Logging ----------------------------------
logging.level.root=INFO
logging.level.com.example.colegio_ayacucho=INFO
logging.level.org.hibernate.SQL=WARN
