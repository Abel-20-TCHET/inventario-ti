<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{fragments/layout :: head('Activos')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-3 px-lg-4 py-4">

    <div th:replace="~{fragments/alertas :: flash}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-pc-display text-primary me-1"></i>Inventario de activos</h1>
            <p class="text-muted mb-0">
                <span th:text="${pagina.totalElements}">0</span> equipo(s) encontrado(s).
            </p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-success"
               th:href="@{/activos/exportar(q=${filtro.q},
                                            tipoId=${filtro.tipoId},
                                            estado=${filtro.estado},
                                            ubicacionId=${filtro.ubicacionId})}">
                <i class="bi bi-filetype-csv me-1"></i>Exportar CSV
            </a>
            <a class="btn btn-primary" th:href="@{/activos/nuevo}">
                <i class="bi bi-plus-lg me-1"></i>Nuevo activo
            </a>
        </div>
    </div>

    <!-- Buscador y filtros -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/activos}" class="row g-2 align-items-end">
                <div class="col-12 col-lg-4">
                    <label for="q" class="form-label small fw-semibold mb-1">Buscar</label>
                    <input type="text" id="q" name="q" class="form-control"
                           th:value="${filtro.q}"
                           placeholder="Código, nombre, marca o N° de serie">
                </div>
                <div class="col-6 col-md-3 col-lg-2">
                    <label for="tipoId" class="form-label small fw-semibold mb-1">Tipo</label>
                    <select id="tipoId" name="tipoId" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="t : ${tipos}"
                                th:value="${t.id}"
                                th:text="${t.nombre}"
                                th:selected="${filtro.tipoId != null and filtro.tipoId == t.id}">
                        </option>
                    </select>
                </div>
                <div class="col-6 col-md-3 col-lg-2">
                    <label for="estado" class="form-label small fw-semibold mb-1">Estado</label>
                    <select id="estado" name="estado" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}"
                                th:value="${e.name()}"
                                th:text="${e.etiqueta}"
                                th:selected="${filtro.estado == e}">
                        </option>
                    </select>
                </div>
                <div class="col-6 col-md-3 col-lg-2">
                    <label for="ubicacionId" class="form-label small fw-semibold mb-1">Ubicación</label>
                    <select id="ubicacionId" name="ubicacionId" class="form-select">
                        <option value="">Todas</option>
                        <option th:each="u : ${ubicaciones}"
                                th:value="${u.id}"
                                th:text="${u.nombre}"
                                th:selected="${filtro.ubicacionId != null and filtro.ubicacionId == u.id}">
                        </option>
                    </select>
                </div>
                <div class="col-6 col-md-3 col-lg-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-search me-1"></i>Buscar
                    </button>
                    <a th:href="@{/activos}" class="btn btn-outline-secondary"
                       title="Limpiar filtros" aria-label="Limpiar filtros">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Código</th>
                        <th scope="col">Nombre</th>
                        <th scope="col" class="d-none d-md-table-cell">Tipo</th>
                        <th scope="col" class="d-none d-lg-table-cell">Ubicación</th>
                        <th scope="col">Estado</th>
                        <th scope="col" class="d-none d-xl-table-cell">Criticidad</th>
                        <th scope="col">Garantía</th>
                        <th scope="col" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${pagina.empty}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                            No se encontraron activos con los filtros aplicados.
                        </td>
                    </tr>
                    <tr th:each="a : ${pagina.content}">
                        <td class="fw-semibold font-monospace" th:text="${a.codigo}">CI-001</td>
                        <td>
                            <a class="text-decoration-none fw-semibold"
                               th:href="@{/activos/{id}(id=${a.id})}"
                               th:text="${a.nombre}">Nombre del equipo</a>
                            <div class="small text-muted d-md-none"
                                 th:text="${a.tipo.nombre}">Tipo</div>
                        </td>
                        <td class="d-none d-md-table-cell" th:text="${a.tipo.nombre}">Servidor</td>
                        <td class="d-none d-lg-table-cell" th:text="${a.ubicacion.nombre}">Sala de servidores</td>
                        <td>
                            <span class="badge"
                                  th:classappend="|text-bg-${a.estado.claseCss}|"
                                  th:text="${a.estado.etiqueta}">Operativo</span>
                        </td>
                        <td class="d-none d-xl-table-cell">
                            <span class="badge"
                                  th:classappend="|text-bg-${a.criticidad.claseCss}|"
                                  th:text="${a.criticidad.etiqueta}">Alta</span>
                        </td>
                        <td class="text-nowrap">
                            <span class="badge"
                                  th:classappend="|text-bg-${a.estadoGarantia.claseCss}|">
                                <i class="bi bi-shield-check me-1"></i>
                                <span th:text="${a.estadoGarantia.etiqueta}">Vigente</span>
                            </span>
                            <div class="small text-muted"
                                 th:if="${a.fechaFinGarantia != null}"
                                 th:text="${#temporals.format(a.fechaFinGarantia, 'dd/MM/yyyy')}">
                                31/12/2027
                            </div>
                            <div class="small text-muted" th:text="${a.garantiaTexto}"></div>
                        </td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/activos/{id}(id=${a.id})}"
                               title="Ver detalle" aria-label="Ver detalle">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/activos/{id}/editar(id=${a.id})}"
                               title="Editar" aria-label="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form class="d-inline" method="post"
                                  sec:authorize="hasRole('ADMIN')"
                                  th:action="@{/activos/{id}/eliminar(id=${a.id})}"
                                  th:attr="data-confirm=|¿Eliminar el activo ${a.codigo} - ${a.nombre}? Esta acción no se puede deshacer.|">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        title="Eliminar" aria-label="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/paginacion :: paginacion(pagina=${pagina}, filtro=${filtro})}"></div>

</main>

<div th:replace="~{fragments/layout :: pie}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
