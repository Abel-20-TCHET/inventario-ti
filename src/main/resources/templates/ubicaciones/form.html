<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{fragments/layout :: head(${esEdicion} ? 'Editar ubicación' : 'Nueva ubicación')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h1 class="h3 mb-3">
                <i class="bi bi-geo-alt text-primary me-1"></i>
                <span th:text="${esEdicion} ? 'Editar ubicación' : 'Nueva ubicación'">Nueva ubicación</span>
            </h1>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="${esEdicion} ? @{/ubicaciones/{id}(id=${form.id})} : @{/ubicaciones}"
                          method="post" th:object="${form}" novalidate>

                        <input type="hidden" th:field="*{id}">

                        <div th:replace="~{fragments/alertas :: erroresGlobales}"></div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">
                                Nombre <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="nombre" class="form-control"
                                   th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                   placeholder="Ej.: Pabellón 1" maxlength="100" autofocus>
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/ubicaciones}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Guardar
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: pie}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
