<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Error del sistema')}"></head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 text-center">

            <div class="display-1 text-danger mb-2">
                <i class="bi bi-exclamation-octagon-fill"></i>
            </div>

            <h1 class="h2 mb-2">Error interno (500)</h1>
            <p class="text-muted mb-4">
                <span th:text="${mensaje != null ? mensaje : 'Ocurrió un error inesperado. Intente nuevamente o contacte al área de TI.'}">
                    Ocurrió un error inesperado.
                </span>
            </p>

            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a class="btn btn-primary" th:href="@{/dashboard}">
                    <i class="bi bi-house me-1"></i>Volver al panel
                </a>
                <a class="btn btn-outline-secondary" href="javascript:history.back()">
                    <i class="bi bi-arrow-left me-1"></i>Página anterior
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
