<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Solicitud no válida')}"></head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 text-center">

            <div class="display-1 text-warning mb-2">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>

            <h1 class="h2 mb-2">No se pudo completar la operación (400)</h1>
            <p class="text-muted mb-4">
                <span th:text="${mensaje != null ? mensaje : 'La solicitud no es válida o incumple una regla del negocio.'}">
                    La solicitud no es válida.
                </span>
            </p>

            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a class="btn btn-primary" th:href="@{/dashboard}">
                    <i class="bi bi-speedometer2 me-1"></i>Ir al panel
                </a>
                <a class="btn btn-outline-secondary" href="javascript:history.back()">
                    <i class="bi bi-arrow-left me-1"></i>Página anterior
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
