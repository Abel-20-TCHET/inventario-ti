<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{fragments/layout :: head('Cambiar contraseña')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h1 class="h3 mb-3"><i class="bi bi-key text-primary me-1"></i>Cambiar contraseña</h1>

            <div class="alert alert-info d-flex gap-2" th:if="${session.DEBE_CAMBIAR_PASSWORD != null}">
                <i class="bi bi-info-circle-fill"></i>
                <div>
                    Su cuenta usa una contraseña temporal. Por seguridad, debe cambiarla
                    antes de continuar usando el sistema.
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/perfil/cambiar-password}" method="post"
                          th:object="${form}" novalidate autocomplete="off">

                        <div th:replace="~{fragments/alertas :: erroresGlobales}"></div>

                        <div class="mb-3">
                            <label for="actual" class="form-label fw-semibold">Contraseña actual</label>
                            <input type="password" id="actual" class="form-control"
                                   th:field="*{actual}"
                                   th:classappend="${#fields.hasErrors('actual')} ? 'is-invalid' : ''"
                                   autocomplete="current-password">
                            <div class="invalid-feedback" th:errors="*{actual}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="nueva" class="form-label fw-semibold">Nueva contraseña</label>
                            <input type="password" id="nueva" class="form-control"
                                   th:field="*{nueva}"
                                   th:classappend="${#fields.hasErrors('nueva')} ? 'is-invalid' : ''"
                                   placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                            <div class="invalid-feedback" th:errors="*{nueva}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmar" class="form-label fw-semibold">Confirmar nueva contraseña</label>
                            <input type="password" id="confirmar" class="form-control"
                                   th:field="*{confirmar}"
                                   th:classappend="${#fields.hasErrors('confirmar')} ? 'is-invalid' : ''"
                                   autocomplete="new-password">
                            <div class="invalid-feedback" th:errors="*{confirmar}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Actualizar contraseña
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: pie}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
