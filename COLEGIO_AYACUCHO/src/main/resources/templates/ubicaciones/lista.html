<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{fragments/layout :: head('Ubicaciones')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">

    <div th:replace="~{fragments/alertas :: flash}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-geo-alt text-primary me-1"></i>Ubicaciones</h1>
            <p class="text-muted mb-0">Pabellones, laboratorio, administración y sala de servidores.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/ubicaciones/nuevo}">
            <i class="bi bi-plus-lg me-1"></i>Nueva ubicación
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" style="width: 70px;">#</th>
                        <th scope="col">Nombre</th>
                        <th scope="col" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(ubicaciones)}">
                        <td colspan="3" class="text-center text-muted py-4">
                            No hay ubicaciones registradas.
                        </td>
                    </tr>
                    <tr th:each="u, iter : ${ubicaciones}">
                        <td class="text-muted" th:text="${iter.count}">1</td>
                        <td class="fw-semibold" th:text="${u.nombre}">Sala de servidores</td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/ubicaciones/{id}/editar(id=${u.id})}"
                               title="Editar" aria-label="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form class="d-inline" method="post"
                                  th:action="@{/ubicaciones/{id}/eliminar(id=${u.id})}"
                                  th:attr="data-confirm=|¿Eliminar la ubicación '${u.nombre}'?|">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        title="Eliminar" aria-label="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: pie}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
