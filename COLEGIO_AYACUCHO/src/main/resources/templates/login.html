<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body class="bg-primary bg-gradient">

<div class="login-wrapper py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-9 col-md-6 col-lg-5 col-xl-4">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <div class="display-6 text-primary">
                                <i class="bi bi-hdd-network-fill"></i>
                            </div>
                            <h1 class="h4 fw-bold mt-2 mb-1">Inventario de Activos de TI</h1>
                            <p class="text-muted mb-0">Colegio Ayacucho · Ayacucho, Perú</p>
                        </div>

                        <div th:if="${mensaje}" class="alert alert-success py-2" role="alert">
                            <i class="bi bi-check-circle-fill me-1"></i>
                            <span th:text="${mensaje}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger py-2" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/login}" method="post" autocomplete="off">

                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username"
                                           name="username" placeholder="Ej.: admin"
                                           required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password"
                                           name="password" placeholder="Ingrese su contraseña"
                                           required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                            </button>
                        </form>

                        <p class="text-center text-muted small mt-4 mb-0">
                            Acceso exclusivo para el personal de TI del colegio.
                        </p>
                    </div>
                </div>

                <p class="text-center text-white-50 small mt-3 mb-0">
                    &copy; 2026 Colegio Ayacucho · ITIL - Gestión de Servicios de TI
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
