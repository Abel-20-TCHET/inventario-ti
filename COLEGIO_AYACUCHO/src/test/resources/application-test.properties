# =============================================================
# Perfil de pruebas: base de datos H2 en memoria (no toca PostgreSQL)
# =============================================================
spring.datasource.url=jdbc:h2:mem:inventario_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# No cargar los 45 activos de ejemplo durante las pruebas
app.seed.enabled=false

logging.level.root=WARN
